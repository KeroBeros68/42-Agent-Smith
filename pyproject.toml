readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "docker>=7.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "types-docker>=7.2.0.20260811",
]

