[project]
name = "student"
version = "0.1.0"
description = "Agent Smith - agent loop, sandbox and benchmark agents (MBPP, SWE-bench)"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "docker>=7.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sandbox = "sandbox.cli:main"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "types-docker>=7.2.0.20260811",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "student/agent_core",
    "student/agent_mbpp",
    "student/agent_swebench",
    "student/sandbox",
]

